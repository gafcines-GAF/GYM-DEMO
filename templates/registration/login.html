{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<form method="post" class="tarjeta login">
  {% csrf_token %}
  <h1>Ingresar</h1>
  {% if form.errors %}<p class="aviso aviso--error">Usuario o contraseña incorrectos.</p>{% endif %}
  <label>Usuario <input name="username" autofocus required autocomplete="username"></label>
  <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="primario">Entrar</button>
</form>
{% endblock %}
